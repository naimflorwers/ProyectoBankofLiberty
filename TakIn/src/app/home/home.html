<!-- 1. MENÚ LATERAL (MÓVIL) -->
<ion-menu contentId="main-content" side="end">
  <ion-header>
    <!-- Cabecera del menú lateral en azul más oscuro -->
    <ion-toolbar style="--background: #1a252f; --color: #f0f0f0;">
      <ion-title>Menú TakIn</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Contenido del menú lateral con fondo AZUL -->
  <ion-content class="menu-content">
    <ion-list lines="none" style="background: transparent;">
      
      <!-- Items del menú (con fondo transparente para tomar el color azul) -->
      <ion-item button href="#" class="menu-item-dark">
        <ion-icon name="card-outline" slot="start"></ion-icon>
        <ion-label>Tarjeta de Débito</ion-label>
      </ion-item>
      <ion-item button href="#" class="menu-item-dark">
        <ion-icon name="card" slot="start"></ion-icon>
        <ion-label>Tarjeta de Crédito</ion-label>
      </ion-item>
      <ion-item button href="#" class="menu-item-dark">
        <ion-icon name="trending-up" slot="start"></ion-icon>
        <ion-label>Inversiones</ion-label>
      </ion-item>
      <ion-item button href="#" class="menu-item-dark">
        <ion-icon name="business" slot="start"></ion-icon>
        <ion-label>TakIn</ion-label>
      </ion-item>
      <ion-item button href="#" class="menu-item-dark">
        <ion-icon name="help-circle" slot="start"></ion-icon>
        <ion-label>Ayuda</ion-label>
      </ion-item>

      <!-- SECCIÓN EMPLEADO (MÓVIL): DOS BOTONES AMARILLOS -->
      <div style="margin-top: 30px; padding: 0 10px;">
        <p style="color: #ffd700; margin-bottom: 10px; font-weight: bold; padding-left: 10px;">ACCESO EMPLEADOS</p>
        
        <ion-button expand="block" routerLink="/login" class="btn-yellow-mobile">
          <ion-icon name="person" slot="start"></ion-icon>
          GERENTE
        </ion-button>
        
        <ion-button expand="block" routerLink="/login" class="btn-yellow-mobile" style="margin-top: 10px;">
          <ion-icon name="briefcase" slot="start"></ion-icon>
          EJECUTIVO
        </ion-button>
      </div>

    </ion-list>
  </ion-content>
</ion-menu>


<!-- 2. CONTENIDO PRINCIPAL -->
<div id="main-content" class="ion-page">
  
  <ion-header class="ion-no-border">
    <ion-toolbar style="--background: #2c3e50; --color: #f0f0f0; --min-height: 70px;">
      
      <!-- LOGO -->
      <ion-buttons slot="start">
        <img src="assets/logo.png" alt="Logo" style="height: 45px; margin-left: 15px; margin-right: 10px; border-radius: 5px;">
        <h3 style="margin: 0; color: #FEE568; font-weight: bold; font-size: 1.6rem;">TakIn</h3>
      </ion-buttons>
  
      <!-- MENÚ DE ESCRITORIO -->
      <ion-buttons slot="end" class="ion-hide-lg-down desktop-menu">
        <ion-button fill="clear" class="nav-btn">Tarjeta de Débito</ion-button>
        <ion-button fill="clear" class="nav-btn">Tarjeta de Crédito</ion-button>
        <ion-button fill="clear" class="nav-btn">Inversiones</ion-button>
        
        <ion-button fill="clear" class="nav-btn">
          TakIn <ion-icon name="chevron-down-outline" style="font-size: 12px; margin-left: 5px;"></ion-icon>
        </ion-button>
        <ion-button fill="clear" class="nav-btn">
          Ayuda <ion-icon name="chevron-down-outline" style="font-size: 12px; margin-left: 5px;"></ion-icon>
        </ion-button>
  
        <!-- BOTÓN EMPLEADO CON DESPLEGABLE (Trigger ID: click-trigger) -->
        <ion-button id="click-trigger" class="btn-empleado">
          SOY EMPLEADO <ion-icon name="chevron-down-outline" style="margin-left: 5px;"></ion-icon>
        </ion-button>

        <!-- COMPONENTE DESPLEGABLE (POPOVER) -->
        <ion-popover trigger="click-trigger" triggerAction="click" dismissOnSelect="true">
          <ng-template>
            <ion-content class="popover-content">
              <ion-list lines="none" style="background: #34495e;">
                <ion-item button routerLink="/login" class="popover-item">
                  <ion-label>Gerente</ion-label>
                </ion-item>
                <ion-item button routerLink="/login" class="popover-item">
                  <ion-label>Ejecutivo</ion-label>
                </ion-item>
              </ion-list>
            </ion-content>
          </ng-template>
        </ion-popover>

      </ion-buttons>
  
      <!-- BOTÓN HAMBURGUESA (MÓVIL) -->
      <ion-buttons slot="end" class="ion-hide-xl-up">
        <ion-menu-button style="--color: #ffd700; transform: scale(1.1); margin-right: 10px;"></ion-menu-button>
      </ion-buttons>
  
    </ion-toolbar>
  </ion-header>
  
  <!-- CONTENIDO PRINCIPAL -->
  <ion-content [fullscreen]="true">
    <ion-grid class="hero-container">
      <ion-row class="ion-align-items-center ion-justify-content-center h-100">
        
        <!-- TEXTO -->
        <ion-col size="12" size-lg="5" class="ion-text-center ion-text-lg-start ion-padding-start">
          <div class="hero-text-block">
            <h1>
              La única cuenta donde tus <br>
              <span class="highlight-inversiones">inversiones</span> <br> 
              y tus 
              <span class="highlight-tarjetas">tarjetas</span> <br>
              se llevan bien
            </h1>
            <button class="btn-cliente-custom" (click)="soyClienteClick()">
              SOY CLIENTE
            </button>
          </div>
        </ion-col>
  
        <!-- IMAGEN -->
        <ion-col size="12" size-lg="7" class="ion-text-center">
          <div class="hero-image-wrapper">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <img src="assets/tarjeta.png" alt="Tarjeta Takin" class="card-image-rotate">
            <div class="circle circle-3"></div>
          </div>
        </ion-col>
  
      </ion-row>
    </ion-grid>
  </ion-content>
</div>
