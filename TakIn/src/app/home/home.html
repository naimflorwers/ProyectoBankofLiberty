<!-- 1. MENÚ LATERAL (MÓVIL) -->
<div class="side-menu" [class.menu-open]="menuOpen">
  <div class="menu-header" style="background: #1a252f; color: #f0f0f0;">
    <h3>Menú TakIn</h3>
    <button class="menu-close-btn" (click)="toggleMenu()">✕</button>
  </div>

  <!-- Contenido del menú lateral con fondo AZUL -->
  <div class="menu-content">
    <ul class="menu-list">
      
      <!-- Items del menú -->
      <li class="menu-item-dark">
        <a href="#"><span class="icon">💳</span> Tarjeta de Débito</a>
      </li>
      <li class="menu-item-dark">
        <a href="#"><span class="icon">💳</span> Tarjeta de Crédito</a>
      </li>
      <li class="menu-item-dark">
        <a href="#"><span class="icon">📈</span> Inversiones</a>
      </li>
      <li class="menu-item-dark">
        <a href="#"><span class="icon">🏦</span> TakIn</a>
      </li>
      <li class="menu-item-dark">
        <a href="#"><span class="icon">❓</span> Ayuda</a>
      </li>

      <!-- SECCIÓN EMPLEADO (MÓVIL): DOS BOTONES AMARILLOS -->
      <div style="margin-top: 30px; padding: 0 10px;">
        <p style="color: #ffd700; margin-bottom: 10px; font-weight: bold; padding-left: 10px;">ACCESO EMPLEADOS</p>
        
        <button class="btn btn-block btn-yellow-mobile" routerLink="/login">
          <span class="icon">👔</span>
          GERENTE
        </button>
        
        <button class="btn btn-block btn-yellow-mobile" style="margin-top: 10px;" routerLink="/login">
          <span class="icon">👔</span>
          EJECUTIVO
        </button>
      </div>

    </ul>
  </div>
</div>

<!-- Overlay para cerrar el menú al hacer clic fuera -->
<div class="menu-overlay" [class.show]="menuOpen" (click)="toggleMenu()"></div>


<!-- 2. CONTENIDO PRINCIPAL -->
<div id="main-content" class="main-page">
  
  <header class="app-header" style="background: #2c3e50; color: #f0f0f0; min-height: 70px;">
      
      <!-- LOGO -->
      <div class="header-logo">
        <img src="assets/logo.png" alt="Logo" style="height: 45px; margin-left: 15px; margin-right: 10px; border-radius: 5px;">
        <h3 style="margin: 0; color: #FEE568; font-weight: bold; font-size: 1.6rem;">TakIn</h3>
      </div>
  
      <!-- MENÚ DE ESCRITORIO -->
      <nav class="desktop-menu">
        <button class="btn nav-btn">Tarjeta de Débito</button>
        <button class="btn nav-btn">Tarjeta de Crédito</button>
        <button class="btn nav-btn">Inversiones</button>
        
        <button class="btn nav-btn">
          TakIn <span class="icon">▼</span>
        </button>
        <button class="btn nav-btn">
          Ayuda <span class="icon">▼</span>
        </button>
  
        <!-- BOTÓN EMPLEADO CON DESPLEGABLE -->
        <div class="dropdown">
          <button class="btn btn-empleado" (click)="toggleDropdown()">
            SOY EMPLEADO <span class="icon">▼</span>
          </button>

          <!-- MENÚ DESPLEGABLE -->
          <div class="dropdown-menu" [class.show]="dropdownOpen" style="background: #34495e;">
            <a routerLink="/login" class="dropdown-item">Gerente</a>
            <a routerLink="/login" class="dropdown-item">Ejecutivo</a>
          </div>
        </div>

      </nav>
  
      <!-- BOTÓN HAMBURGUESA (MÓVIL) -->
      <div class="mobile-menu-btn">
        <button class="btn hamburger-btn" (click)="toggleMenu()" style="color: #ffd700;">☰</button>
      </div>
  
  </header>
  
  <!-- CONTENIDO PRINCIPAL -->
  <div class="page-content">
    <div class="hero-container">
      <div class="hero-row">
        
        <!-- TEXTO -->
        <div class="hero-col hero-text-col">
          <div class="hero-text-block">
            <h1>
              La única cuenta donde tus <br>
              <span class="highlight-inversiones">inversiones</span> <br> 
              y tus 
              <span class="highlight-tarjetas">tarjetas</span> <br>
              se llevan bien
            </h1>
            <button class="btn-cliente-custom" routerLink="/login">
              SOY CLIENTE
            </button>
          </div>
        </div>
  
        <!-- IMAGEN -->
        <div class="hero-col hero-image-col">
          <div class="hero-image-wrapper">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <img src="assets/tarjeta.png" alt="Tarjeta Takin" class="card-image-rotate">
            <div class="circle circle-3"></div>
          </div>
        </div>
  
      </div>
    </div>
  </div>
</div>
