<ion-content [fullscreen]="true">
  
  <div class="main-container">
    
    <!-- Contenedor de la tarjeta -->
    <div class="card-container">
      
      <!-- Header de la tarjeta -->
      <header class="card-header">
        <!-- Logo (puedes ajustar la ruta si es necesaria) -->
        <img src="assets/logo.png" alt="Logo" class="logo">
        <h1>Bank of Liberty</h1>
      </header>

      <!-- Cuerpo del formulario -->
      <main class="form-box">
        <h2>Confirmación de identidad</h2>
        
        <div class="icono-container">
          <!-- Icono nativo de Ionic -->
          <ion-icon name="checkmark-circle" class="check-icon"></ion-icon>
        </div>

        <!-- Input de contraseña -->
        <div class="input-wrapper">
          <input 
            type="password" 
            [(ngModel)]="password" 
            placeholder="••••••••••••••••••••••••" 
            class="input-text"
          >
        </div>
        
        <button type="button" class="btn" [routerLink]="['/transferencia-exitosa']">CONTINUAR</button>
      </main>

    </div>

  </div>

</ion-content>
