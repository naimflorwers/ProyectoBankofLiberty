<ion-content [fullscreen]="true">
  
  <div class="page-container">
    
    <!-- Header -->
    <header class="header">
      <a routerLink="/home" class="header-link">
        <img src="assets/logo.png" alt="Logo TakIn" class="logo">
        <h3>TakIn</h3>
      </a>
    </header>

    <main class="main-content">
      <div class="title-bar">
        SOLICITUDES DE PRESTAMOS
      </div>
      
      <div class="solicitudes-list">
        
        <!-- Solicitud Pendiente -->
        <div class="solicitud-item">
          <span class="status-icon icon-pending">
            <ion-icon name="square-outline"></ion-icon>
          </span>
          <span class="solicitud-nombre">Nombre del Solicitante</span>
          <span class="solicitud-fecha">DD/MM/AA</span>
        </div>

        <!-- Solicitud Pendiente -->
        <div class="solicitud-item">
          <span class="status-icon icon-pending">
            <ion-icon name="square-outline"></ion-icon>
          </span>
          <span class="solicitud-nombre">Nombre del Solicitante</span>
          <span class="solicitud-fecha">DD/MM/AA</span>
        </div>

        <!-- Solicitud Clickeable (Ruta Gerente) -->
        <a routerLink="/prestamo-gerente" class="solicitud-link">
          <div class="solicitud-item hover-effect">
            <span class="status-icon icon-pending">
              <ion-icon name="square-outline"></ion-icon>
            </span>
            <span class="solicitud-nombre">Nombre del Solicitante (Clic aquí)</span>
            <span class="solicitud-fecha">DD/MM/AA</span>
          </div>
        </a>

        <!-- Solicitud Aprobada -->
        <div class="solicitud-item">
          <span class="status-icon icon-approved">
            <ion-icon name="checkmark-outline"></ion-icon>
          </span>
          <span class="solicitud-nombre">Nombre del Solicitante</span>
          <span class="solicitud-fecha">DD/MM/AA</span>
        </div>
        
        <!-- Espaciadores visuales -->
        <div class="solicitud-item empty">
          <span class="status-icon icon-pending"><ion-icon name="square-outline"></ion-icon></span>
        </div>
        <div class="solicitud-item empty">
          <span class="status-icon icon-pending"><ion-icon name="square-outline"></ion-icon></span>
        </div>
        <div class="solicitud-item empty">
          <span class="status-icon icon-pending"><ion-icon name="square-outline"></ion-icon></span>
        </div>
        <div class="solicitud-item empty">
          <span class="status-icon icon-pending"><ion-icon name="square-outline"></ion-icon></span>
        </div>
        <div class="solicitud-item empty">
          <span class="status-icon icon-pending"><ion-icon name="square-outline"></ion-icon></span>
        </div>
      </div>
      
      <!-- Footer con botón de regresar al menú gerente -->
      <div class="footer">
        <button class="regresar-btn" [routerLink]="['/menu-gerente']">REGRESAR</button>
      </div>
    </main>
  </div>

</ion-content>
