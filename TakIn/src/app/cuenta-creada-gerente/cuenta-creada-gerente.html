<ion-content [fullscreen]="true">
  
  <!-- Wrapper para centrar vertical y horizontalmente -->
  <div class="main-wrapper">
    
    <div class="container">
      <div class="header">
        <h1 class="bank-title">Bank of Liberty</h1>
      </div>

      <div class="confirmation-box">
        <div class="check-icon">
          <ion-icon name="checkmark-circle-outline"></ion-icon>
        </div>
        <h2 class="confirmation-text">Cuenta Creada Correctamente</h2>

        <div class="details">
          <div class="detail-item">
            <strong>No. de cuenta:</strong> 
            <a href="#">15633488</a>
          </div>
          <div class="detail-item">
            <strong>Fecha y hora:</strong> 
            <span>04/09/2025 09:45 AM</span>
          </div>
          <div class="detail-item">
            <strong>Nombre:</strong> 
            <span>Juan Pérez Gomez</span>
          </div>
        </div>

        <!-- Redirección al menú de gerente -->
        <button class="btn-aceptar" [routerLink]="['/menu-gerente']">ACEPTAR</button>
      </div>
    </div>

  </div>

</ion-content>
