<div class="page-content">
  
  <div class="main-wrapper">
    <div class="container">
      <h2>Bank of Liberty</h2>
      <h3>Retiro de efectivo</h3>

      <form class="retiro-form">

        <!-- Columna Izquierda: Datos -->
        <div class="left-side">
          <div class="form-group">
            <label>Cuenta de origen</label>
            <input type="text" placeholder="Ingresa la cuenta de origen">
          </div>

          <div class="form-group">
            <label>Monto a retirar</label>
            <input type="number" placeholder="Ingresa el monto">
          </div>

          <button type="button" class="btn" [routerLink]="['/operacion-completa']">CONFIRMAR</button>
        </div>

        <!-- Columna Derecha: Método y QR -->
        <div class="right-side">
          <div class="form-group">
            <label>Método de retiro:</label>
            <div class="select-wrapper">
              <select>
                <option value="" disabled selected>Seleccione</option>
                <option value="qr">Generar código QR</option>
                <option value="sucursal">Sucursal</option>
              </select>
            </div>
          </div>

          <div class="qr-box">
            <!-- QR un poco más grande para visibilidad -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=Retiro" alt="QR de retiro">
            <small>válido por cierto tiempo.</small>
          </div>

          <div class="form-group reference-group">
            <label>No. de Referencia</label>
            <input type="text" value=" 7279 3717 6832" readonly class="readonly-input">
          </div>
        </div>

      </form>
    </div>
  </div>

</div>
