<div class="page-content">
  
  <div class="main-container">
    
    <!-- Header -->
    <header class="header">
      <!-- Logo con enlace al home o menú -->
      <a routerLink="/menu-cliente" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
        <img src="assets/logo.png" alt="Logo" class="logo" />
        <span class="title">Bank of Liberty</span>
      </a>
      <span class="user-icon">
        <span class="icon"></span>
      </span>
    </header>

    <div class="content">
      <div class="transfer-box">
        <h2>Selecciona tu cuenta</h2>
        
        <!-- Mensaje de carga -->
        <div *ngIf="cargando" class="loading-msg">
          <div class="spinner"></div>
          <p>Cargando cuentas...</p>
        </div>
        
        <!-- Mensaje de error -->
        <div *ngIf="error" class="error-msg">
          <p>{{ error }}</p>
        </div>
        
        <div class="tarjetas-title">Mis Cuentas</div>
        
        <!-- Lista de cuentas -->
        <div *ngIf="cuentas.length === 0 && !cargando && !error" class="empty-msg">
          <p>No tienes cuentas disponibles</p>
        </div>
        
        <div class="accounts-list">
          <div *ngFor="let cuenta of cuentas" 
               class="account-card" 
               [class.selected]="cuentaSeleccionada?.Numcuenta === cuenta.Numcuenta"
               (click)="seleccionarCuenta(cuenta)">
            
            <div class="card-header-row">
              <span class="account-name">{{ cuenta.Banco || 'TakIn' }}</span>
              <span class="icon"></span>
            </div>
            
            <span class="account-balance">${{ cuenta.Dinero | number:'1.2-2' }}</span>
            
            <div class="card-footer-row">
              <span class="account-number">**** {{ cuenta.Numcuenta.toString().slice(-4) }}</span>
              <span class="account-label">Saldo disponible</span>
            </div>
          </div>
        </div>
        
        <button type="button" 
                class="continuar-btn" 
                [disabled]="!cuentaSeleccionada"
                (click)="continuar()">
          CONTINUAR
        </button>
      </div>
    </div>

  </div>

</div>
