<div class="page-content">
  
  <div class="main-container">
    
    <!-- Header -->
    <div class="header-custom">
      <!-- El logo te lleva al menú de gerente -->
      <a routerLink="/menu-gerente" style="display: flex; align-items: center; text-decoration: none; color: inherit;">
        <img src="assets/logo.png" alt="Logo" class="logo">
        <span class="title">TakIn</span>
      </a>
    </div>

    <!-- Formulario -->
    <div class="form-card">
      <form>
        <div class="row-full">
          <label>Nombre completo</label>
          <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Nombre del cliente" />
        </div>

        <div class="row-full">
          <label>Número de cuenta bancaria</label>
          <input type="text" [(ngModel)]="cuenta" name="cuenta" placeholder="Número de cuenta" />
        </div>

        <div class="button-container">
          <!-- Ruta específica para Gerente -->
          <button type="button" [routerLink]="['/cuenta-eliminada-gerente']">CANCELAR CUENTA</button>
        </div>
      </form>
    </div>

  </div>

</div>
