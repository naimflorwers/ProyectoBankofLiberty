<div class="page-content">
  
  <!-- Contenedor Flex para centrar todo -->
  <div class="login-container">
    
    <!-- Logo (Enlazado al Home) -->
    <a routerLink="/home" class="logo-link">
      <img src="assets/logo.png" alt="Logo TakIn" class="logo">
    </a>

    <!-- Tarjeta de Login -->
    <div class="login-card">
      <h2>Iniciar Sesión</h2>
      <p class="security-text">Estás en un entorno con seguridad NSSH</p>

      <form (ngSubmit)="login()" autocomplete="off">
        
        <!-- Input Correo -->
        <div class="input-group">
          <input type="text" id="correo" name="correo" placeholder="Correo" [(ngModel)]="correo" required>
        </div>

        <!-- Input Contraseña + Botones -->
        <div class="input-group password-wrapper">
          <input [type]="passwordVisible ? 'text' : 'password'" id="contrasena" name="contrasena" placeholder="Contraseña" [(ngModel)]="contrasena" required>
          
          <!-- Botón Ojo (Toggle) -->
          <button type="button" class="toggle-password" (click)="togglePassword()" tabindex="-1">
            <span class="icon">{{passwordVisible ? "" : ""}}</span>
          </button>
          
          <!-- Botón Enviar (Flecha) -->
          <button type="submit" class="submit-btn">
            <span class="icon"></span>
          </button>
        </div>

      </form>

      <!-- Mensaje de Error -->
      <div *ngIf="errorMsg" class="error-message">{{ errorMsg }}</div>

      <!-- Links de ayuda -->
      <p class="forgot-password-link">
        <a href="#" (click)="recuperarContrasena($event)">¿Olvidaste tu contraseña?</a>
      </p>

      <p class="register-link">
        Aún no tienes cuenta? <a routerLink="/abrir-cuenta">Regístrate ahora</a>
      </p>
    </div>

  </div>
</div>
