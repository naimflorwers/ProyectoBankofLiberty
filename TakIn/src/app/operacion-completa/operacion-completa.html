<ion-content [fullscreen]="true">
  
  <div class="main-wrapper">
    
    <div class="container">
      
      <div class="header">
        <h1 class="bank-title">TakIn</h1>
      </div>

      <div class="confirmation-box">
        <div class="check-icon">
          <!-- Usamos ion-icon para mejor calidad -->
          <ion-icon name="checkmark-circle-outline"></ion-icon>
        </div>
        <h2 class="confirmation-text">Retiro Generado Correctamente</h2>

        <div class="details">
          <div class="detail-item">
            <strong>Monto:</strong> 
            <a href="#">$5,000.00 MXN</a>
          </div>
          <div class="detail-item">
            <strong>Cuenta de Destino:</strong> 
            <a href="#">1234</a>
          </div>
          <div class="detail-item">
            <strong>Fecha y hora:</strong> 
            <span>04/09/2025 09:45 AM</span>
          </div>
          <div class="detail-item">
            <strong>Folio:</strong> 
            <a href="#">000123456</a>
          </div>
        </div>

        <button class="btn-aceptar" [routerLink]="['/menu-cliente']">ACEPTAR</button>
      </div>
    </div>

  </div>

</ion-content>
