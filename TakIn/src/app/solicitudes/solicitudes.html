<div class="page-content">
  
  <div class="page-container">
    
    <!-- Header -->
    <header class="header">
      <a routerLink="/home" class="header-link">
        <img src="assets/logo.png" alt="Logo TakIn" class="logo">
        <h3>TakIn</h3>
      </a>
    </header>

    <main class="main-content">
      <div class="title-bar">
        SOLICITUDES DE PRESTAMOS
      </div>
      
      <div class="solicitudes-list">
        
        <!-- Solicitud Pendiente -->
        <div class="solicitud-item">
          <span class="status-icon icon-pending">
            <!-- Usamos checkbox outline para simular tu icono -->
            <span class="icon"></span>
          </span>
          <span class="solicitud-nombre">Nombre del Solicitante</span>
          <span class="solicitud-fecha">DD/MM/AA</span>
        </div>

        <!-- Solicitud Pendiente -->
        <div class="solicitud-item">
          <span class="status-icon icon-pending">
            <span class="icon"></span>
          </span>
          <span class="solicitud-nombre">Nombre del Solicitante</span>
          <span class="solicitud-fecha">DD/MM/AA</span>
        </div>

        <!-- Solicitud Clickeable (Link) -->
        <a routerLink="/prestamo" class="solicitud-link">
          <div class="solicitud-item hover-effect">
            <span class="status-icon icon-pending">
              <span class="icon"></span>
            </span>
            <span class="solicitud-nombre">Nombre del Solicitante (Clic aquí)</span>
            <span class="solicitud-fecha">DD/MM/AA</span>
          </div>
        </a>

        <!-- Solicitud Aprobada -->
        <div class="solicitud-item">
          <span class="status-icon icon-approved">
            <span class="icon"></span>
          </span>
          <span class="solicitud-nombre">Nombre del Solicitante</span>
          <span class="solicitud-fecha">DD/MM/AA</span>
        </div>
        
        <!-- Items vacíos para rellenar espacio visual -->
        <div class="solicitud-item empty">
          <span class="status-icon icon-pending"><span class="icon"></span></span>
        </div>
        <div class="solicitud-item empty">
          <span class="status-icon icon-pending"><span class="icon"></span></span>
        </div>
        <div class="solicitud-item empty">
          <span class="status-icon icon-pending"><span class="icon"></span></span>
        </div>
        <div class="solicitud-item empty">
          <span class="status-icon icon-pending"><span class="icon"></span></span>
        </div>
        <div class="solicitud-item empty">
          <span class="status-icon icon-pending"><span class="icon"></span></span>
        </div>
      </div>
      
      <div class="footer">
        <button class="regresar-btn" [routerLink]="['/menu-ejecutivo']">REGRESAR</button>
      </div>
    </main>
  </div>

</div>
