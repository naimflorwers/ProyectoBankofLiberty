<div class="page-content">
  
  <div class="recuperar-container">
    
    <!-- Logo -->
    <a routerLink="/home" class="logo-link">
      <img src="assets/logo.png" alt="Logo Bank of Liberty" class="logo">
    </a>

    <div class="recuperar-card">
      
      <!-- Indicador de pasos -->
      <div class="pasos-indicador">
        <div class="paso" [class.activo]="pasoActual >= 1" [class.completado]="pasoActual > 1">
          <div class="paso-numero">
            <span *ngIf="pasoActual > 1" class="icon"></span>
            <span *ngIf="pasoActual <= 1">1</span>
          </div>
          <div class="paso-texto">Correo</div>
        </div>
        
        <div class="paso-linea" [class.completado]="pasoActual > 1"></div>
        
        <div class="paso" [class.activo]="pasoActual >= 2" [class.completado]="pasoActual > 2">
          <div class="paso-numero">
            <span *ngIf="pasoActual > 2" class="icon"></span>
            <span *ngIf="pasoActual <= 2">2</span>
          </div>
          <div class="paso-texto">Código</div>
        </div>
        
        <div class="paso-linea" [class.completado]="pasoActual > 2"></div>
        
        <div class="paso" [class.activo]="pasoActual >= 3">
          <div class="paso-numero">3</div>
          <div class="paso-texto">Nueva</div>
        </div>
      </div>

      <h2>Recuperar Contraseña</h2>

      <!-- PASO 1: Solicitar correo -->
      <div *ngIf="pasoActual === 1">
        <p class="description">Ingresa tu correo electrónico y te enviaremos un código de verificación.</p>
        
        <div class="input-group">
          <label for="correo">Correo Electrónico</label>
          <input 
            type="email" 
            id="correo" 
            name="correo" 
            placeholder="ejemplo@correo.com" 
            [(ngModel)]="correo" 
            required>
        </div>

        <button type="button" class="btn-principal" (click)="solicitarCodigo()" [disabled]="procesando">
          {{ procesando ? 'Enviando...' : 'Enviar Código' }}
        </button>
      </div>

      <!-- PASO 2: Verificar código -->
      <div *ngIf="pasoActual === 2">
        <p class="description">
          Hemos enviado un código de 6 dígitos a <strong>{{ correo }}</strong>
        </p>
        
        <div class="input-group">
          <label for="codigo">Código de Verificación</label>
          <input 
            type="text" 
            id="codigo" 
            name="codigo" 
            placeholder="123456" 
            [(ngModel)]="codigoIngresado" 
            maxlength="6"
            pattern="[0-9]*" 
            inputmode="numeric" 
            class="codigo-input"
            required>
          <small>Ingresa el código de 6 dígitos</small>
        </div>

        <button type="button" class="btn-principal" (click)="verificarCodigo()" [disabled]="procesando">
          {{ procesando ? 'Verificando...' : 'Verificar Código' }}
        </button>

        <button type="button" class="btn-secundario" (click)="reenviarCodigo()" [disabled]="procesando">
          {{ procesando ? 'Enviando...' : 'Reenviar Código' }}
        </button>
      </div>

      <!-- PASO 3: Nueva contraseña -->
      <div *ngIf="pasoActual === 3">
        <p class="description">Ingresa tu nueva contraseña</p>
        
        <div class="input-group">
          <label for="nuevaContrasena">Nueva Contraseña</label>
          <div class="password-wrapper">
            <input 
              [type]="passwordVisible ? 'text' : 'password'" 
              id="nuevaContrasena" 
              name="nuevaContrasena" 
              placeholder="Mínimo 6 caracteres" 
              [(ngModel)]="nuevaContrasena" 
              required>
            <button type="button" class="toggle-password" (click)="togglePasswordVisibility()" tabindex="-1">
              <span class="icon">{{passwordVisible ? "" : ""}}</span>
            </button>
          </div>
        </div>

        <div class="input-group">
          <label for="confirmarContrasena">Confirmar Contraseña</label>
          <div class="password-wrapper">
            <input 
              [type]="confirmPasswordVisible ? 'text' : 'password'" 
              id="confirmarContrasena" 
              name="confirmarContrasena" 
              placeholder="Repite tu contraseña" 
              [(ngModel)]="confirmarContrasena" 
              required>
            <button type="button" class="toggle-password" (click)="toggleConfirmPasswordVisibility()" tabindex="-1">
              <span class="icon">{{confirmPasswordVisible ? "" : ""}}</span>
            </button>
          </div>
        </div>

        <button type="button" class="btn-principal" (click)="cambiarContrasena()" [disabled]="procesando">
          {{ procesando ? 'Guardando...' : 'Cambiar Contraseña' }}
        </button>
      </div>

      <!-- Mensajes -->
      <div *ngIf="errorMsg" class="message error-message">{{ errorMsg }}</div>
      <div *ngIf="successMsg" class="message success-message">{{ successMsg }}</div>

      <!-- Botones de navegación -->
      <div class="navigation-buttons">
        <button *ngIf="pasoActual > 1 && pasoActual <= 3" type="button" class="btn-link" (click)="volverPaso()" [disabled]="procesando">
          ← Volver
        </button>
        
        <button type="button" class="btn-link" (click)="volverLogin()" [disabled]="procesando">
          Volver al Login
        </button>
      </div>
      
    </div>
  </div>
</div>
